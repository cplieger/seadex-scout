# seadex-scout config.

# ----------------------------------------------------------------------------
# Connections & schedule
# ----------------------------------------------------------------------------
# At least one arr must be enabled with a url + api_key.
sonarr:
  enabled: true
  url: "http://sonarr:8989" # where seadex-scout reaches Sonarr (internal is fine)
  api_key: "" # required when enabled; a ${SONARR_API_KEY}-style env ref works too (see README)
  public_url: "" # browser base for the report's deep-links; empty = use url
radarr:
  enabled: false
  url: "http://radarr:7878"
  api_key: ""
  public_url: ""

mode: "daemon" # daemon (scheduled) | report (one-shot, exit)
# One cadence for BOTH the alert engine and the Torznab feed, so a notification
# and what the arrs grab from the feed come from the same refresh. Runs on start;
# off/disabled/0 = no internal timer, trigger each cycle with the `poll` subcommand.
poll_interval: "3h"

log:
  level: "info" # debug | info | warn | error
  format: "json" # json | text

# ----------------------------------------------------------------------------
# Report / alert engine — shapes the findings + report, NOT the indexer
# ----------------------------------------------------------------------------
animebytes: false # true if you have an AnimeBytes account (adds AB releases + links)

filters:
  exclude_remux: false # true drops remuxes (default keeps them)
  require_dual_audio: false # true drops non-dual-audio releases
  exclude_specials: false # true drops OVA/ONA/specials
  # Per-tag, per-surface exclusions keyed on SeaDex's own release tags.
  # EMPTY (the default) MEANS NOTHING IS FILTERED: a release SeaDex tagged
  # "Broken" is still alerted on as a better release available, still counts as a
  # best in the report, and is still served in the Torznab feed. The report
  # annotates it "(broken)" either way. List the tags you want gone, and on which
  # surfaces — surfaces are exactly findings (the alerts), report, feed (Torznab
  # search + RSS); an unknown surface name or a tag with no surfaces is a startup
  # error. Tag matching is exact and case-insensitive.
  exclude_tags: {}
  # exclude_tags:
  #   broken: [findings, report, feed]
  #   incomplete: [feed]

  # AniList IDs whose findings are never alerted on. Findings are reported
  # continuously for as long as they are true, so your alerting stack keeps
  # reminding you until you act — which is what makes a lost notification
  # recoverable. Put a show here when you have decided NOT to upgrade it and
  # want the reminders to stop. It suppresses the alert only: the show still
  # appears in report mode, and the RSS feed is untouched (this app never
  # withholds a release from Sonarr/Radarr). [] = alert on everything.
  ignore: []
  # ignore: [154587, 21519]

arr_tags:
  include: [] # scan only items with one of these tags; [] = all
  exclude: [] # skip items with any of these tags (wins over include)

report:
  dir: "/config/reports" # report-<UTC date+time>.md + .json written here

# ----------------------------------------------------------------------------
# Indexer engine — optional Torznab feed; the arrs filter it (profiles + CFs)
# ----------------------------------------------------------------------------
# Served by the daemon whenever a Torznab URL is set (both empty = off, no port).
# Its curation set + RSS feed rebuild together with the alert loop on poll_interval.
indexer:
  feed_api_key: "" # the arrs send this, the feed checks it (openssl rand -hex 16); ${SEADEX_SCOUT_FEED_KEY} ref works
  nyaa_torznab_url: "" # Prowlarr Nyaa Torznab URL, e.g. http://prowlarr:9696/1/api ("" = off)
  ab_torznab_url: "" # Prowlarr AnimeBytes Torznab URL ("" = off)
  prowlarr_api_key: "" # Prowlarr API key; secret, never logged (${SEADEX_SCOUT_PROWLARR_KEY} ref works)
  ab_passkey: "" # AnimeBytes passkey for AB RSS download links ("" = AB RSS off); ${SEADEX_SCOUT_AB_PASSKEY} ref works
