# LogQL alert rules for seadex-scout, for Loki's ruler. Ship the container's
# logs to Loki and load this file into Loki's ruler. The rules assume the
# default log.level: info and log.format: json. Thresholds and severity labels
# are starting points. Change the container selector to the label your log
# collector sets. docs/monitoring.md explains each rule and its routing, and
# its Log contract table lists the messages and attributes the rules match.
groups:
  - name: seadex-scout
    rules:
      # Every ERROR line without a condition attribute. The [1h] window spans
      # several passes, so a fault that repeats on every pass stays one alert.
      - alert: SeadexScoutCycleError
        expr: |
          sum by (container) (count_over_time(
            {container="seadex-scout"} | json | level=`ERROR` | condition=`` [1h]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "seadex-scout logged an error that needs a look"
          description: >
            seadex-scout logged an error that is not an upstream outage.
            Usually a Sonarr or Radarr library read failed, logged as
            `library walk failed`, so findings stop updating. Check the arr
            `url` and `api_key`. The `ERROR` line names any other cause.
      # A lasting upstream condition is logged at ERROR on every pass while it
      # holds. Loki's ruler has no keep_firing_for, so the [1h] window holds the
      # alert between passes. Group by condition only, because the other
      # attributes change from pass to pass.
      - alert: SeadexScoutUpstreamUnavailable
        expr: |
          sum by (condition) (count_over_time(
            {container="seadex-scout"} | json | level=`ERROR`
            | condition=~`seadex-unreachable|seadex-catalogue-fetch-failing|seadex-window-oversize|anilist-lookups-failing|mapping-refresh-rejected`
            [1h]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            {{if eq $labels.condition "seadex-unreachable" -}}
            SeaDex is not answering, so seadex-scout cannot see new releases
            {{- else if eq $labels.condition "seadex-catalogue-fetch-failing" -}}
            seadex-scout cannot download the full SeaDex catalogue
            {{- else if eq $labels.condition "seadex-window-oversize" -}}
            SeaDex changed too much at once for the quick check
            {{- else if eq $labels.condition "anilist-lookups-failing" -}}
            AniList is not answering title lookups
            {{- else if eq $labels.condition "mapping-refresh-rejected" -}}
            seadex-scout keeps refusing an update to its anime ID map
            {{- else -}}
            seadex-scout reports a lasting upstream problem: {{$labels.condition}}
            {{- end}}
          description: >-
            {{if eq $labels.condition "seadex-unreachable" -}}
            seadex-scout has not reached SeaDex at seadex.moe for about 2
            hours, usually an outage at SeaDex itself. Findings and the Torznab
            feed are kept, and the alert resolves on its own. If other websites
            fail too, check this host's network.
            {{- else if eq $labels.condition "seadex-catalogue-fetch-failing" -}}
            The last 2 full SeaDex catalogue downloads failed, so releases
            removed or edited on SeaDex are missed. Findings are kept. Unless
            SeaDex is unreachable too, look for `seadex fetch failed` in the
            log. It clears after the next daily pass.
            {{- else if eq $labels.condition "seadex-window-oversize" -}}
            SeaDex reported more changes than the quick check downloads at
            once, so new releases can take a day to appear. Findings are kept.
            It usually clears on its own. If it lasts over a day, check the
            container's clock.
            {{- else if eq $labels.condition "anilist-lookups-failing" -}}
            Title lookups at AniList failed on the last 2 daily passes. Anime
            that need a lookup are not compared and keep their findings.
            AniList is usually down or rate limiting. If other websites fail
            too, check this host's network.
            {{- else if eq $labels.condition "mapping-refresh-rejected" -}}
            seadex-scout refused the last 8 updates of its anime ID map, which
            failed its safety checks. It keeps using its last good copy. To
            accept an intended change, remove `state.json` from `/config` and
            restart. Otherwise, wait for an upstream fix.
            {{- else -}}
            seadex-scout reports the lasting condition {{$labels.condition}}.
            Search the container log for lines with this condition.
            {{- end}}
      # Same emission and window as the upstream rule above. A shrunken library
      # is judged per arr, so arr is in the grouping and each arr resolves alone.
      - alert: SeadexScoutLibraryDegraded
        expr: |
          sum by (condition, arr) (count_over_time(
            {container="seadex-scout"} | json | level=`ERROR`
            | condition=~`library-walk-shrunk|library-walk-partial` [1h]
          )) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: >-
            {{if eq $labels.condition "library-walk-shrunk" -}}
            seadex-scout sees far fewer items in {{$labels.arr}} than before
            {{- else if eq $labels.condition "library-walk-partial" -}}
            Sonarr could not return the episodes of some series
            {{- else -}}
            seadex-scout reports a lasting library problem: {{$labels.condition}}
            {{- end}}
          description: >-
            {{if eq $labels.condition "library-walk-shrunk" -}}
            On the last 2 daily passes, {{$labels.arr}} returned under half its
            earlier series or movies. Findings are kept. Check that
            {{$labels.arr}} has its full library and that `arr_tags` matches
            it. An intended shrink is accepted after 6 daily passes.
            {{- else if eq $labels.condition "library-walk-partial" -}}
            On the last 2 daily passes, Sonarr failed to return the episode list
            for some series. Those series are not compared and keep their
            findings. Search the log for `sonarr episode fetch`, then check
            those series in Sonarr.
            {{- else -}}
            seadex-scout reports the lasting condition {{$labels.condition}}.
            Search the container log for lines with this condition.
            {{- end}}
      # Matches every pass's completion line, the degraded ones included, and
      # the start of a full pass, so an upstream outage and a slow cold pass do
      # not fire it. The 3h window matches the health check's cold-pass
      # allowance.
      - alert: SeadexScoutScanStalled
        expr: |
          absent_over_time({container="seadex-scout"} |~ `((cycle|tick) (complete|degraded)|reconcile started)` [3h])
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "seadex-scout has shown no sign of life in 3h"
          description: >
            seadex-scout logged no pass start or completion line in 3h. The
            check loop may be stuck, so the Torznab feed and findings stop
            updating. Rule out a stopped container or log pipeline, then restart
            the container.
      # Quick checks keep the rule above quiet, so this watches the daily full
      # pass alone. The 72h window is three reconcile intervals.
      - alert: SeadexScoutReconcileStalled
        expr: |
          absent_over_time({container="seadex-scout"} |~ `reconcile complete` [72h])
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "seadex-scout has not completed a full reconcile in 72h"
          description: >
            No `reconcile complete` line in 72h, so the daily full pass is
            failing or not running. Removed or edited SeaDex releases are
            missed, and a release you already upgraded keeps being reported.
            Look for repeated `cycle degraded` or arr errors.
      # Grouped by the finding's identity. info_hash and seadex_tags turn a
      # changed recommendation into a new alert. Loki's ruler has no
      # keep_firing_for, so the [12h] window holds the alert between passes.
      - alert: SeadexScoutBetterReleaseFound
        expr: |
          sum by (title, alert_title, al_id, arr, arr_url, nyaa_url, public_url, public_tracker, ab_url, ab_tracker, season, recommended_group, alert_recommended_group, seadex_tags, info_hash) (
            count_over_time(
              {container="seadex-scout"} | json | msg=`better release available` [12h]
            )
          ) > 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: '{{$labels.alert_title}}: new SeaDex release'
          description: >-
            [New release](https://seadex.moe/{{$labels.al_id}}/) for {{$labels.alert_title}}
            {{- if $labels.arr_url}} ([open in {{$labels.arr}}]({{$labels.arr_url}})){{end}}
            {{- if and $labels.season (ne $labels.season "0")}} Season {{$labels.season}}{{end}}
            ({{$labels.alert_recommended_group}}, {{$labels.seadex_tags}}).
            {{if $labels.nyaa_url}}[Nyaa]({{$labels.nyaa_url}}){{end}}
            {{- if $labels.public_url}}{{if $labels.nyaa_url}} · {{end}}[{{$labels.public_tracker}}]({{$labels.public_url}}){{end}}
            {{- if $labels.ab_url}}{{if or $labels.nyaa_url $labels.public_url}} · {{end}}[{{$labels.ab_tracker}}]({{$labels.ab_url}}){{end}}
      # Same [12h] window as the rule above. arr is in the grouping because one
      # AniList entry can own an item in each arr.
      - alert: SeadexScoutMixedGroupManual
        expr: |
          sum by (title, alert_title, al_id, arr, arr_url, season, recommended_group, alert_recommended_group, seadex_tags) (
            count_over_time(
              {container="seadex-scout"} | json | msg=`series spans multiple release groups, manual review` [12h]
            )
          ) > 0
        for: 5m
        labels:
          severity: info
        annotations:
          summary: '{{$labels.alert_title}}: SeaDex release needs manual review'
          description: >-
            [SeaDex](https://seadex.moe/{{$labels.al_id}}/) recommends
            {{$labels.alert_recommended_group}}
            {{- if $labels.seadex_tags}} ({{$labels.seadex_tags}}){{end}} for
            {{$labels.alert_title}}
            {{- if $labels.arr_url}} ([open in {{$labels.arr}}]({{$labels.arr_url}})){{end}}
            {{- if and $labels.season (ne $labels.season "0")}} Season {{$labels.season}}{{end}}.
            Your files span several release groups, so check by hand which one
            you have.
      # Fires once per report run that runs as the container command. A report
      # started with docker exec logs to the exec session instead.
      - alert: SeadexScoutReportWritten
        expr: |
          sum by (anime) (count_over_time(
            {container="seadex-scout"} | json | msg=`report written` [1h]
          )) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "seadex-scout report generated"
          description: >
            seadex-scout wrote a report with {{$labels.anime}} rows. Read the
            timestamped report-<UTC>.md and .json pair in the `report.dir`
            folder.
