# Example compose for seadex-scout. See the README for all configuration options and hardening.
services:
  seadex-scout:
    image: ghcr.io/cplieger/seadex-scout:latest
    container_name: seadex-scout
    restart: unless-stopped
    user: "1000:1000"  # match your host user; create ./config host-owned before first start

    # See README "Configuration reference"; config.yaml expands these .env-backed secret variables.
    environment:
      SONARR_API_KEY: "${SONARR_API_KEY:-}"
      RADARR_API_KEY: "${RADARR_API_KEY:-}"
      # Indexer feed only. Configuring it makes the daemon bind :9118, which the
      # arrs must be able to reach - publish the port or share a network with them.
      SEADEX_SCOUT_FEED_KEY: "${SEADEX_SCOUT_FEED_KEY:-}"
      SEADEX_SCOUT_PROWLARR_KEY: "${SEADEX_SCOUT_PROWLARR_KEY:-}"
      SEADEX_SCOUT_AB_PASSKEY: "${SEADEX_SCOUT_AB_PASSKEY:-}"
    volumes:
      # No config.yaml: writes a starter, exits, and unless-stopped retries.
      # Edit the host-owned starter; the next retry starts automatically.
      - "./config:/config"  # holds config.yaml, state, and the reports dir
